name: Sync Upstream Aya

on:
  push:
    paths:
      - ".github/workflows/sync-upstream.yml"
      - "scripts/**"
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch, tag or commit to validate"
        required: false
        default: "main"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync, build and open PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt
          rustc --version
          cargo --version

      - name: Test sync scripts
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Sync upstream
        env:
          AYA_UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
        run: bash scripts/sync-upstream.sh

      - name: Format generated patches and verify idempotency
        run: |
          cargo fmt --all
          python3 scripts/apply-appopt-patches.py --check

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Build workspace
        run: cargo build --workspace --all-features

      - name: Check Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo check --workspace --all-features --target aarch64-linux-android
          cargo check --workspace --all-features --target armv7-linux-androideabi
          cargo check --workspace --all-features --target x86_64-linux-android
          cargo check --workspace --all-features --target i686-linux-android

      - name: Test workspace
        run: cargo test --workspace --lib --all-features

      - name: Create pull request
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "上游没有可提交变化"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="sync/aya-upstream-$(date -u +%Y%m%d-%H%M%S)"
          BASE_BRANCH="${GITHUB_REF_NAME:-main}"

          git checkout -b "$BRANCH"
          git commit -m "sync: update aya upstream"
          git push origin "$BRANCH"

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "sync: update aya upstream" \
            --body-file UPSTREAM.md
