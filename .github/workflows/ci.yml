name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Check Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo check --workspace --target aarch64-linux-android
          cargo check --workspace --target armv7-linux-androideabi
          cargo check --workspace --target x86_64-linux-android
          cargo check --workspace --target i686-linux-android

      - name: Test workspace
        run: cargo test --workspace --lib
