name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt
          rustc --version
          cargo --version

      - name: Test sync scripts
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Verify Android patches
        run: python3 scripts/apply-appopt-patches.py --check

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Build workspace
        run: cargo build --workspace --all-features

      - name: Check Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo check --workspace --all-features --target aarch64-linux-android
          cargo check --workspace --all-features --target armv7-linux-androideabi
          cargo check --workspace --all-features --target x86_64-linux-android
          cargo check --workspace --all-features --target i686-linux-android

      - name: Test workspace
        run: cargo test --workspace --lib --all-features
