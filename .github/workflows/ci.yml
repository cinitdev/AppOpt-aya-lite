name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace --lib

